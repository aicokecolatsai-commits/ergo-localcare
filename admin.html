<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【人因小管家】場次管理與專屬 QR Code 控制台</title>
  <!-- 瀏覽器分頁與行動裝置主畫面 App 圖示 (Favicon & PWA Icons) -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/app-icon-192.png">
  <link rel="shortcut icon" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="人因小管家">
  <meta name="theme-color" content="#0284c7">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- QRCode.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="css/custom.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#172033',
              900: '#0f172a',
              950: '#0a0f1d'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">

  <!-- 頂部導航 -->
  <header class="border-b border-slate-200 bg-white/95 backdrop-blur px-4 md:px-6 py-2.5 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-50 shadow-sm">
    <div class="flex items-center gap-3">
      <img src="assets/logo.png" alt="人因小管家" class="w-10 h-10 object-contain drop-shadow-sm flex-shrink-0">
      <div>
        <h1 class="text-sm md:text-base font-bold text-slate-900 flex items-center gap-2">
          <span>人因小管家 • 場次管理控制台</span>
        </h1>
        <p class="text-[11px] text-slate-500">蔡健儀 專屬研習系統・QR Code 生成、即時連線與 NMQ 數據匯出</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a id="nav-goto-dashboard" href="dashboard.html" class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-xs font-bold text-white transition-colors flex items-center gap-1.5 shadow-sm">
        <span>🖥️</span> 前往大螢幕看板 (Live)
      </a>
      <a id="nav-goto-student" href="index.html" class="px-3 py-1.5 rounded-lg bg-white hover:bg-slate-50 text-xs font-semibold text-slate-700 border border-slate-200 transition-colors flex items-center gap-1 shadow-sm">
        <span>📱</span> 學員測驗頁
      </a>
    </div>
  </header>

  <!-- 主控制面板 -->
  <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow space-y-5">
    
    <!-- 建立與切換場次 -->
    <div class="ergo-card p-6 border border-slate-200 bg-white shadow-sm space-y-4">
      <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
        <span>🏷️</span> 設定本次演講場次代碼
      </h2>
      <div class="flex flex-col sm:flex-row gap-3">
        <input 
          id="session-id-input" 
          type="text" 
          placeholder="例如: 20260915_XX高中 或 TSMC_2026" 
          class="flex-grow px-4 py-2.5 rounded-lg bg-slate-50 border border-slate-200 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 text-slate-900 placeholder-slate-400 text-sm font-medium outline-none transition-all"
        />
        <button id="btn-create-session" class="px-5 py-2.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-bold text-sm transition-all flex items-center justify-center gap-1.5 flex-shrink-0 shadow-sm">
          <span>✨</span> 更新 / 切換場次
        </button>
      </div>

      <!-- 最近場次快速切換 -->
      <div class="pt-1">
        <span class="text-xs text-slate-500 font-semibold block mb-2">最近使用過的場次：</span>
        <div id="recent-sessions-list" class="flex flex-wrap gap-2">
          <!-- 由 admin.js 動態產生 -->
        </div>
      </div>
    </div>

    <!-- 專屬 QR Code 與投影連結 -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-5">
      <!-- QR Code 顯示卡片 -->
      <div class="md:col-span-5 ergo-card p-6 border border-slate-200 bg-white shadow-sm flex flex-col items-center justify-center text-center">
        <span class="text-xs font-semibold text-slate-600 mb-3 uppercase tracking-wider">現場學員掃描專用 QR Code</span>
        <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-100 shadow-inner mb-3">
          <div id="admin-qr-code" class="flex items-center justify-center min-w-[180px] min-h-[180px]"></div>
        </div>
        <p class="text-xs text-slate-500">
          滑鼠右鍵可直接「複製圖片」貼入簡報投影片中
        </p>
      </div>

      <!-- 網址與大螢幕直連連結 -->
      <div class="md:col-span-7 ergo-card p-6 border border-slate-200 bg-white shadow-sm flex flex-col justify-between gap-4">
        <div>
          <h3 class="text-sm font-bold text-slate-900 mb-3">🔗 專屬網址快速複製與直接開啟</h3>
          
          <!-- 學員填寫端 -->
          <div class="space-y-1.5 mb-4">
            <label class="text-xs font-semibold text-slate-700">
              📱 學員填寫端網址 (Student URL)
            </label>
            <div class="flex gap-2">
              <input id="link-student" type="text" readonly class="w-full px-3 py-2 rounded-lg bg-slate-50 border border-slate-200 text-xs text-slate-700 font-mono" />
              <button id="btn-copy-student" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-200 transition-colors flex-shrink-0">
                複製
              </button>
              <a id="btn-open-student" href="#" target="_blank" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-sky-700 text-xs font-semibold rounded-lg border border-slate-200 transition-colors flex-shrink-0 flex items-center">
                開啟 ↗
              </a>
            </div>
          </div>

          <!-- 講師大螢幕端 -->
          <div class="space-y-1.5">
            <label class="text-xs font-semibold text-slate-700">
              🖥️ 講師大螢幕投影網址 (Live Dashboard URL)
            </label>
            <div class="flex gap-2">
              <input id="link-dashboard" type="text" readonly class="w-full px-3 py-2 rounded-lg bg-slate-50 border border-slate-200 text-xs text-sky-700 font-mono font-bold" />
              <button id="btn-copy-dash" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-200 transition-colors flex-shrink-0">
                複製
              </button>
              <a id="btn-open-dash" href="#" target="_blank" class="px-3 py-2 bg-sky-50 hover:bg-sky-100 text-sky-800 text-xs font-bold rounded-lg border border-sky-200 transition-colors flex-shrink-0 flex items-center">
                開啟 ↗
              </a>
            </div>
          </div>
        </div>

        <!-- 數據管理動作 -->
        <div class="pt-4 border-t border-slate-100 flex flex-wrap items-center gap-2.5">
          <button id="btn-export-csv" class="px-3.5 py-2 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 text-xs font-semibold transition-all flex items-center gap-1.5 shadow-sm">
            <span>📥</span> 匯出本場數據 (CSV)
          </button>
          <button id="btn-generate-demo" class="px-3.5 py-2 rounded-lg bg-sky-50 hover:bg-sky-100 text-sky-800 border border-sky-300 text-xs font-semibold transition-all flex items-center gap-1.5 shadow-sm">
            <span>🎲</span> 生成 30 筆模擬數據
          </button>
          <button id="btn-clear-session" class="px-3.5 py-2 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-800 border border-rose-300 text-xs font-semibold transition-all flex items-center gap-1.5 shadow-sm">
            <span>🗑️</span> 清空本場數據
          </button>
        </div>

      </div>
    </div>

  </main>

  <!-- 底部版權 -->
  <footer class="border-t border-slate-200 py-3 text-center text-[11px] text-slate-500 bg-white flex flex-col sm:flex-row items-center justify-center gap-1">
    <span>© 人因小管家 (Noah) 蔡健儀 專屬研發</span>
    <span class="hidden sm:inline">｜</span>
    <span>人因工學智慧財產權保護・未經授權禁止商用翻拷</span>
  </footer>

  <!-- 腳本引入 -->
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
